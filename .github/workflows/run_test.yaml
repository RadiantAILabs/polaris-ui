name: Tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'bun.lockb'
      - 'tsconfig.json'
      - 'vite.config.*'
      - '.github/workflows/**'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests & Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.x'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.21'

      - name: Cache Bun + node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun
            **/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install deps
        run: bun install --ci

      - name: Run tests
        run: bun test

      - name: Run lint checks
        run: bun run lint

      - name: Run type checks
        run: bun run check

      - name: Check markdown
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          config: .markdownlint.json
